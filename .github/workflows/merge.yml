name: Merge Jild 11 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild11.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-11.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined_ids = ['jild11-masala-8', 'jild11-masala-16', 'jild11-masala-46',
                          'jild11-masala-135', 'jild11-masala-201', 'jild11-masala-255',
                          'jild11-masala-287', 'jild11-masala-325', 'jild11-masala-342',
                          'jild11-masala-394', 'jild11-masala-437']
          for cid in combined_ids:
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'] if hits else None)
              assert len(hits) == 1
          assert len(items) == 394
          assert len(pages) == 626
          assert min(pages) == 6 and max(pages) == 739
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-11.json
          gh release create v1.0 jild-11.json --title "Jild 11 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 11: 394 items, 626 pages (volume_id 54). Generated by merge_jild11.py from the 15 chunk files; 11 same-id split masail combined (masala-16 special rule: chunk 03 sawal is the full restatement, 02b sawal discarded)." || gh release upload v1.0 jild-11.json --clobber
